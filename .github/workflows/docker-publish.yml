name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch, tag, or commit SHA (shlee322/delivery-tracker)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: shlee322/delivery-tracker
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream

      - name: Extract upstream metadata
        id: upstream
        working-directory: upstream
        run: |
          short_sha=$(git rev-parse --short HEAD)
          full_sha=$(git rev-parse HEAD)
          commit_date=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "commit_date=${commit_date}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/badugisoft/delivery-tracker
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.upstream.outputs.short_sha }}
            type=raw,value=${{ steps.upstream.outputs.commit_date }}-${{ steps.upstream.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.full_sha }}
            org.opencontainers.image.description=Container image built from https://github.com/shlee322/delivery-tracker

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
